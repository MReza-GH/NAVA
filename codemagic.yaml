
workflows:
  android-debug:
    name: Build Nava Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Download Gradle and build APK
        script: |
          set -eu

          SETTINGS_FILE="$(find "$CM_BUILD_DIR" -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.git/*" -not -path "*/build/*" -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
  echo "Generating temporary debug keystore..."

  keytool -genkeypair -v \
    -keystore "$PROJECT_DIR/debug.keystore" \
    -storepass android \
    -alias androiddebugkey \
    -keypass android \
    -keyalg RSA \
    -keysize 2048 \
    -validity 10000 \
    -dname "CN=Android Debug,O=Android,C=US"
fi

          GRADLE_VERSION=""

          PROPS="gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$PROPS" ]; then
            DIST_URL="$(sed -n 's/^distributionUrl=//p' "$PROPS" | tail -n 1)"
            GRADLE_VERSION="$(printf '%s\n' "$DIST_URL" | sed -nE 's#.*gradle-([0-9]+(\.[0-9]+)+)-(bin|all)\.zip.*#\1#p')"
          fi

          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.13"
            echo "Gradle wrapper properties unavailable; using fallback Gradle $GRADLE_VERSION"
          fi

          echo "Using Gradle version: $GRADLE_VERSION"

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          curl --fail --location --retry 3 --silent --show-error \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$TEMP_DIR/gradle.zip"

          unzip -q "$TEMP_DIR/gradle.zip" -d "$TEMP_DIR"

          "$TEMP_DIR/gradle-${GRADLE_VERSION}/bin/gradle" \
            --no-daemon --stacktrace assembleDebug

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
